<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Органайзер</title>
<meta name="description" content="Цели по группам и деньги по счетам с синхронизацией через Google Диск">
<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Органайзер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  /* Layout: один экран. Телефон — колонка (цели, затем деньги); от 960px — две колонки: цели слева, деньги справа */
  --bg:#f1f2f4;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --ink:#15171c;
  --muted:#6a707d;
  --faint:#9aa0ab;
  --line:#e3e5ea;
  --accent:#2b3fd1;
  --accent-ink:#ffffff;
  --accent-soft:#e7eafc;
  --ok:#17845a;
  --danger:#c3352b;
  --star:#d49a0b;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014;
    --surface:#16191f;
    --surface-2:#1c2028;
    --ink:#e9ebf0;
    --muted:#959bab;
    --faint:#666c7a;
    --line:#262a33;
    --accent:#8a97ff;
    --accent-ink:#0e1014;
    --accent-soft:#222746;
    --ok:#4fc58f;
    --danger:#ff7468;
    --star:#f0b93a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014;
  --surface:#16191f;
  --surface-2:#1c2028;
  --ink:#e9ebf0;
  --muted:#959bab;
  --faint:#666c7a;
  --line:#262a33;
  --accent:#8a97ff;
  --accent-ink:#0e1014;
  --accent-soft:#222746;
  --ok:#4fc58f;
  --danger:#ff7468;
  --star:#f0b93a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Каркас ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.015em}
.top .date{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.top-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sync{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="loading"] i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.sync[data-s="offline"] i{background:var(--star)}
.sync[data-s="error"] i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;flex:0 0 auto;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start;gap:20px}
  .money{position:sticky;top:16px}
  .top h1{font-size:26px}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner p{margin:0;flex:1 1 220px}

/* ---------- Переключатели и кнопки ---------- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg .n{font-family:var(--font-num);font-size:11.5px;margin-left:4px;opacity:.7}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13.5px}
.link{background:none;border:0;color:var(--accent);font-size:13.5px;font-weight:500;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.link.muted{color:var(--muted);font-weight:400}
.foot-links{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0 4px}

/* ---------- Группы и цели ---------- */
.group{padding:6px 0 4px;border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group-h{display:flex;align-items:center;gap:8px;padding:6px 0 2px}
.group-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em;cursor:pointer;overflow-wrap:anywhere}
.group-h .cnt{font-family:var(--font-num);font-size:12px;color:var(--faint)}
.group-h .icon-btn{margin-left:auto;width:30px;height:30px}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:7px 0 7px 10px}
/* Свайп влево — удаление с подтверждением */
.swipe{position:relative;overflow:hidden}
.items .swipe{margin-left:-10px}
.swipe-row{position:relative;z-index:1;background:var(--surface);transition:transform .2s ease;touch-action:pan-y}
.swipe-act{position:absolute;top:0;right:0;bottom:0;width:96px;display:flex;align-items:stretch;justify-content:flex-end;background:var(--danger);visibility:hidden}
.swipe.open .swipe-act,.swipe.moving .swipe-act{visibility:visible}
.swipe-act button{border:0;background:none;color:#fff;font-weight:600;font-size:14px;width:96px;cursor:pointer}

.check{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--faint);background:none;display:grid;place-items:center;cursor:pointer;margin-top:1px;padding:0;color:#fff}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--star);border-color:var(--star)}
.check:hover{border-color:var(--star)}
.check svg{width:12px;height:12px}
.txt{flex:1;min-width:0;cursor:pointer}
.txt .t{overflow-wrap:anywhere}
.item.focus .txt .t{font-weight:500}
.txt .d{display:block;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.star{flex:0 0 auto;background:none;border:0;cursor:pointer;color:var(--faint);padding:0 2px;width:30px;height:24px;display:grid;place-items:center;opacity:.55}
.star:hover{opacity:1;color:var(--star)}
.star.on{color:var(--star);opacity:1}
.star svg{width:18px;height:18px}
.add-item{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
.add-item .plus{flex:0 0 20px;text-align:center;color:var(--faint);font-size:18px;line-height:1}
.add-item input{flex:1;min-width:0;border:0;background:none;padding:5px 0;font-size:16px;outline:none;border-bottom:1px solid var(--accent)}
.add-item input::placeholder{color:var(--faint)}
.plus-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;flex:0 0 auto}
.plus-btn:hover{background:var(--surface-2);color:var(--accent)}
.plus-btn svg{width:18px;height:18px}
.group-h .plus-btn{margin-left:auto}
.group-h .plus-btn + .icon-btn{margin-left:0}
.sec-h .r{display:flex;align-items:center;gap:4px}
.arch{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.arch:last-child{border-bottom:0}
.arch .txt{cursor:default}
.arch .when{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.arch-g{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 2px}
.arch-g:first-child{margin-top:0}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* ---------- Деньги ---------- */
.total{padding:4px 0 8px}
.money-toggle{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 0 3px;color:var(--muted);font-size:13.5px;cursor:pointer;text-align:left}
.money-toggle:hover{color:var(--ink)}
.money-toggle svg{width:16px;height:16px;transition:transform .2s ease}
.money-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.money-detail{padding-top:4px}
.scan-row,.form label.scan-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px;cursor:pointer}
.scan-row:last-child{border-bottom:0}
.scan-row input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.scan-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.scan-row .ch{white-space:nowrap;text-align:right;font-size:14px}
.scan-row .ch s{color:var(--faint);margin-right:6px}
.scan-row.same,.form label.scan-row.same{color:var(--muted);cursor:default}
.progress-line{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:12px 0 6px}
.progress-line i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s ease}
details.raw summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.raw pre{white-space:pre-wrap;font-size:12px;font-family:var(--font-num);background:var(--surface-2);padding:8px;border-radius:8px;max-height:220px;overflow:auto}
.money-detail .sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.money-detail .hint{margin:4px 0 6px}
.total .big{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.total .sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.total .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.acc{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.money-detail .swipe:last-child .acc{border-bottom:0}
.acc .name{min-width:0;overflow-wrap:anywhere}
.acc .note{display:block;font-size:12.5px;color:var(--muted)}
.acc .amt{white-space:nowrap;font-weight:500;text-align:right}
.acc .amt.neg{color:var(--danger)}
.acc .when{display:block;font-size:11.5px;color:var(--faint);font-family:var(--font-body);font-weight:400}

/* ---------- Лист ---------- */
.sheet-wrap{position:fixed;inset:0;background:rgba(8,10,14,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-wrap.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:14px}
.sheet h3{font-size:14px;font-weight:600}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:16px;padding:22px}}
.form{display:grid;gap:12px}
.form label,.form .lbl{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.inp{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.err{border-color:var(--danger)}
textarea.inp{resize:vertical;min-height:70px}
select.inp{appearance:auto}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto}
.actions.start{justify-content:flex-start}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint code{font-family:var(--font-num);font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.sep{border:0;border-top:1px solid var(--line);margin:8px 0}
.status-line{display:flex;align-items:center;gap:8px;font-size:13.5px}
.status-line i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.status-line[data-s="ok"] i{background:var(--ok)}
.status-line[data-s="error"] i{background:var(--danger)}
.status-line[data-s="offline"] i{background:var(--star)}
.status-line[data-s="loading"] i{background:var(--accent)}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:12px;width:max-content;max-width:100%}
.qr svg{display:block;width:200px;height:200px}
.check-line{display:flex !important;grid-template-columns:none;align-items:center;gap:10px;color:var(--ink) !important;font-size:15px !important;cursor:pointer}
.check-line input{width:18px;height:18px;accent-color:var(--star)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .link{color:var(--bg);text-decoration:underline;font-size:14px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Органайзер</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="top-r">
      <button type="button" class="sync" id="sync" data-action="open-settings" data-s="off"><i></i><span id="syncText">Не настроено</span></button>
      <button type="button" class="icon-btn" data-action="open-settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
  </header>

  <div class="banner" id="setupBanner" hidden>
    <p>Синхронизация с Google Диском не настроена: данные пока только на этом устройстве.</p>
    <button type="button" class="btn primary sm" data-action="open-settings">Настроить</button>
  </div>

  <div class="layout">
    <section class="panel goals" aria-labelledby="goalsH">
      <div class="sec-h">
        <h2 id="goalsH">Цели</h2>
        <div class="r">
          <div class="seg" role="group" aria-label="Что показывать">
            <button type="button" data-action="mode" data-mode="focus" id="modeFocus">В работе<span class="n" id="focusCount">0</span></button>
            <button type="button" data-action="mode" data-mode="all" id="modeAll">Все</button>
          </div>
          <button type="button" class="plus-btn" data-action="goals-add" aria-label="Добавить группу или список" title="Добавить группу или список"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div id="groups"></div>
      <div class="foot-links" id="goalsFoot"></div>
    </section>

    <section class="panel money" aria-labelledby="moneyH">
      <div class="sec-h">
        <h2 id="moneyH">Деньги</h2>
        <div class="r">
          <button type="button" class="plus-btn" data-action="scan" aria-label="Обновить суммы со скриншота" title="Обновить суммы со скриншота"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/></svg></button>
          <button type="button" class="plus-btn" data-action="new-account" aria-label="Добавить счёт" title="Добавить счёт"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <input type="file" id="scanFile" accept="image/*" hidden>
        </div>
      </div>
      <div id="totals"></div>
      <div id="accounts"></div>
    </section>
  </div>
</div>

<div class="sheet-wrap" id="sheet" role="dialog" aria-modal="true" aria-label="Редактирование">
  <div class="sheet" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= Справочники ================= */
const CURRENCIES = { RUB: '₽', EUR: '€', USD: '$', TRY: '₺', CNY: '¥', GBP: '£' };
const CUR_NAMES = { RUB: 'Рубли', EUR: 'Евро', USD: 'Доллары', TRY: 'Лиры', CNY: 'Юани', GBP: 'Фунты' };
const KINDS = ['group', 'item', 'account', 'settings', 'task', 'goal', 'tx'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const newId = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function ymd(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtTime(ms) {
  if (!ms) return 'ещё не было';
  const d = new Date(ms);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const t = ymd(), dd = ymd(d);
  const y = new Date(); y.setDate(y.getDate() - 1);
  const day = dd === t ? 'сегодня' : dd === ymd(y) ? 'вчера' : d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
  return day + ' в ' + hm;
}
function ago(ms) {
  if (!ms) return '';
  const days = Math.floor((Date.now() - ms) / 86400000);
  if (days < 1) return 'сегодня';
  if (days === 1) return 'вчера';
  if (days < 30) return days + ' ' + plural(days, ['день', 'дня', 'дней']) + ' назад';
  const d = new Date(ms);
  return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
}
function plural(n, f) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const fmtMoney = (n, cur) => (n < 0 ? '−' : '') + nf.format(Math.abs(Math.round(n * 100) / 100)) + ' ' + (CURRENCIES[cur] || cur || '');
function evalAmount(s) {
  s = String(s == null ? '' : s).replace(/[\s ]/g, '').replace(/,/g, '.').replace(/[−–]/g, '-').replace(/[×х]/g, '*').replace(/:/g, '/');
  if (!s) return null;
  if (!/^[0-9+\-*/().]+$/.test(s)) return null;
  try {
    const v = Function('"use strict";return (' + s + ')')();
    return typeof v === 'number' && isFinite(v) ? Math.round(v * 100) / 100 : null;
  } catch (e) { return null; }
}
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* «Кривоколенный ( АГР ( ТЭП, оформление ))» → название и уточнение */
function splitTitle(s) {
  s = String(s || '').trim();
  const i = s.indexOf('(');
  if (i > 0 && s.endsWith(')')) {
    return { title: s.slice(0, i).trim(), details: s.slice(i + 1, s.length - 1).trim() };
  }
  return { title: s, details: '' };
}
/* Текст с автоматическими ссылками */
function richText(s) {
  const re = /(https?:\/\/[^\s<>"']+[^\s<>"'.,;:)\]])/g;
  let out = '', last = 0, m;
  const str = String(s || '');
  while ((m = re.exec(str))) {
    out += esc(str.slice(last, m.index));
    let label = m[1].replace(/^https?:\/\/(www\.)?/, '');
    if (label.length > 40) label = label.slice(0, 38) + '…';
    out += '<a href="' + esc(m[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>';
    last = m.index + m[1].length;
  }
  return out + esc(str.slice(last));
}

function fetchWithTimeout(url, ms) {

  return fetch(url, ctrl ? { signal: ctrl.signal } : {}).finally(() => clearTimeout(t));

async function fetchFx(force) {
  if (fxLoading) return false;
  if (!force && fx && Date.now() - fx.fetchedAt < FX_TTL) return true;
  if (navigator.onLine === false) return false;
  fxLoading = true;
  let next = null;
  try {
    // 1) ЦБ РФ (зеркало в JSON)
    try {
      const r = await fetchWithTimeout('https://www.cbr-xml-daily.ru/daily_json.js', 8000);
      if (!r.ok) throw new Error('http');
      next = fxFromCbr(await r.json());
    } catch (e) {
      // 2) то же самое через JSONP, если браузер не дал прочитать ответ
      try { next = fxFromCbr(await cbrJsonp()); }

        // 3) запасной источник с рыночными курсами
        const r = await fetchWithTimeout('https://open.er-api.com/v6/latest/RUB', 8000);
        const j = await r.json();
        if (!j || j.result !== 'success' || !j.rates) throw new Error('fx');
        const toRub = { RUB: 1 };
        Object.keys(CURRENCIES).forEach(c => { if (j.rates[c]) toRub[c] = 1 / j.rates[c]; });

      }

  } catch (e) {
    next = null;

  fx = next;
  saveFx();
  render();
  return true;
}

const live = kind => Object.keys(state.records).map(id => state.records[id]).filter(r => r && r.kind === kind && !r.del);
const getRec = id => { const r = state.records[id]; return r && !r.del ? r : null; };
const settings = () => getRec('settings') || {};
const byOrder = (a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0);
const groups = () => live('group').sort(byOrder);
const accounts = () => live('account').sort(byOrder);
const nextOrder = kind => live(kind).reduce((m, r) => Math.max(m, r.order || 0), 0) + 1;

function nextU() { let t = Date.now(); if (t <= lastU) t = lastU + 1; lastU = t; return t; }
function put(rec) {
  const r = Object.assign({}, rec, { u: nextU() });
  delete r.rv;
  state.records[r.id] = r;
  state.dirty[r.id] = r.u;
}
function commit() { saveState(); render(); scheduleSync(); }
function setRec(rec) { put(rec); commit(); }
function delRec(id) { const ex = state.records[id]; if (!ex) return; put({ id, kind: ex.kind, del: true }); commit(); }
function putMany(entries) {
  entries.forEach(([id, body]) => {
    if (body && !body.del) put(Object.assign({}, body, { id }));
    else { const ex = state.records[id]; if (ex && !ex.del) put({ id, kind: ex.kind, del: true }); }
  });
  commit();
}
function withUndo(ids, label, fn) {
  const before = ids.map(id => [id, state.records[id] && !state.records[id].del ? clone(state.records[id]) : null]);
  fn();
  toast(label, { action: 'Вернуть', onAction: () => putMany(before) });
}

/* ================= Синхронизация с Google Диском ================= */
let syncing = false, again = false, syncTimer = null, syncState = 'off', lastError = '';
const configured = () => !!(cfg.url && cfg.key);

function setSync(s, err) {
  syncState = s;
  if (s === 'error') lastError = err || lastError; else if (s === 'ok') lastError = '';
  const el = $('#sync');
  el.dataset.s = s;
  $('#syncText').textContent = { off: 'Не настроено', ok: 'Google Диск', loading: 'Синхронизация', offline: 'Офлайн', error: 'Ошибка' }[s];
  el.title = s === 'error' ? lastError : '';
  $('#setupBanner').hidden = configured();
  const line = document.getElementById('syncLine');
  if (line) { line.dataset.s = s; line.querySelector('span').textContent = syncLineText(); }
}
function syncLineText() {
  if (!configured()) return 'Не подключено';
  if (syncState === 'loading') return 'Синхронизация…';
  if (syncState === 'offline') return 'Нет интернета. Изменения сохранены на устройстве и отправятся позже.';
  if (syncState === 'error') return 'Ошибка: ' + lastError;
  const pend = Object.keys(state.dirty).length;
  return 'Последняя синхронизация ' + fmtTime(state.lastSync) + (pend ? ' · ждут отправки: ' + pend : '');
}
function explainError(e) {
  const m = e && e.message;
  if (m === 'auth') return 'неверный ключ доступа';
  if (m === 'not_setup') return 'в скрипте не выполнена функция setup';
  if (m === 'busy') return 'сервер занят, повтор через минуту';
  if (m === 'badjson') return 'адрес не похож на скрипт органайзера (проверьте доступ «Все»)';
  if (m && m.indexOf('http') === 0) return 'сервер ответил ' + m.slice(5);
  return 'нет связи со скриптом';
}

async function callApi(payload, conf) {
  conf = conf || cfg;
  const res = await fetch(conf.url, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ key: conf.key }, payload))
  });
  if (!res.ok) throw new Error('http ' + res.status);
  const txt = await res.text();
  let data;
  try { data = JSON.parse(txt); } catch (e) { throw new Error('badjson'); }
  if (!data.ok) throw new Error(data.error || 'server');
  return data;
}

function scheduleSync(delay) {
  if (!configured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay == null ? 1200 : delay);
}

async function sync() {
  if (!configured()) { setSync('off'); return; }
  if (syncing) { again = true; return; }
  if (navigator.onLine === false) { setSync('offline'); return; }
  syncing = true;
  setSync('loading');
  const pushed = {};
  const changes = [];
  Object.keys(state.dirty).forEach(id => {
    const r = state.records[id];
    if (r) { pushed[id] = r.u; changes.push(r); } else delete state.dirty[id];
  });
  try {
    const data = await callApi({ action: 'sync', since: state.rev, changes });
    Object.keys(pushed).forEach(id => { if (state.dirty[id] === pushed[id]) delete state.dirty[id]; });
    (data.records || []).forEach(r => {
      if (!r || typeof r.id !== 'string') return;
      const loc = state.records[r.id];
      if (state.dirty[r.id] && loc && (loc.u || 0) > (r.u || 0)) return;
      state.records[r.id] = r;
    });
    state.rev = Math.max(state.rev, data.rev || 0);
    state.lastSync = Date.now();
    saveState();
    render();
    setSync('ok');
  } catch (e) {
    saveState();
    if (navigator.onLine === false) setSync('offline');
    else setSync('error', explainError(e));
  } finally {
    syncing = false;
    if (again) { again = false; scheduleSync(300); }
  }
}

async function connect(url, key) {
  url = (url || '').trim(); key = (key || '').trim();
  const m = url.match(/#setup=([A-Za-z0-9_-]+)/);
  if (m) {
    try {
      const c = JSON.parse(b64urlDecode(m[1]));
      if (c && c.url && c.key) { url = String(c.url).trim(); key = String(c.key).trim(); }
    } catch (e) {}
  }
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast('Адрес должен начинаться с https://script.google.com/'); return false; }
  if (!key) { toast('Вставьте ключ доступа'); return false; }
  setSync('loading');
  try {
    await callApi({ action: 'ping' }, { url, key });
  } catch (e) {
    setSync(configured() ? 'error' : 'off', explainError(e));
    toast('Не удалось подключиться: ' + explainError(e));
    return false;
  }
  const changed = cfg.url !== url || cfg.key !== key;
  cfg = { url, key };
  saveCfg();
  if (changed) {
    state.rev = 0;
    Object.keys(state.records).forEach(id => { state.dirty[id] = state.records[id].u || nextU(); });
    saveState();
  }
  await sync();
  toast('Google Диск подключён');
  return true;
}

function moveRec(id, dir, list) {
  const i = list.findIndex(r => r.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = list[i], b = list[j];
  const oa = a.order || i + 1, ob = b.order || j + 1;
  putMany([[a.id, Object.assign({}, a, { order: ob === oa ? oa + dir : ob })], [b.id, Object.assign({}, b, { order: oa })]]);
}
/* Разбор текста из заметок.
   Блоки разделены пустой строкой; первая строка блока — группа, остальные — цели.
   «★» в начале строки — цель в работе. Блок «Деньги» (или «Счета») — счета вида «Карта — 85000 ₽». */
const CUR_ALIASES = { '₽': 'RUB', 'руб': 'RUB', 'руб.': 'RUB', 'р': 'RUB', 'р.': 'RUB', 'rub': 'RUB', '$': 'USD', 'usd': 'USD', '€': 'EUR', 'eur': 'EUR', '₺': 'TRY', 'try': 'TRY', '¥': 'CNY', 'cny': 'CNY', '£': 'GBP', 'gbp': 'GBP' };
function parseAccountLine(line) {
  const m = line.match(/^(.+?)\s*(?:[—–:]|\s-\s)\s*([−\-]?[\d\s\u00a0.,]+?)\s*(₽|руб\.?|р\.?|RUB|USD|EUR|TRY|CNY|GBP|\$|€|₺|¥|£)?\s*$/i);
  if (!m) return null;
  const amount = evalAmount(m[2]);
  if (amount === null) return null;
  const cur = m[3] ? (CUR_ALIASES[m[3].toLowerCase()] || m[3].toUpperCase()) : null;
  return { name: m[1].trim(), amount, cur: CURRENCIES[cur] ? cur : null };
}
function parseOutline(text) {
  const blocks = String(text || '').replace(/\r/g, '').split(/\n\s*\n/);
  const groupsOut = [], accountsOut = [];
  const bullet = /^([-•*·–]|\d+[.)])\s*/;
  blocks.forEach(b => {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    let name, rest;
    if (bullet.test(lines[0]) || /^[★☆]/.test(lines[0])) { name = 'Разное'; rest = lines; }
    else { name = lines[0].replace(/^#+\s*/, '').replace(/\s*:\s*$/, '').trim(); rest = lines.slice(1); }
    if (/^(деньги|счета|счёта|money)$/i.test(name)) {
      rest.forEach(l => { const a = parseAccountLine(l.replace(bullet, '')); if (a) accountsOut.push(a); });
      return;
    }
    groupsOut.push({
      name,
      items: rest.map(l => {
        l = l.replace(bullet, '').trim();
        const focus = /^★/.test(l);
        return { text: l.replace(/^[★☆]\s*/, '').trim(), focus };
      }).filter(x => x.text)
    });
  });
  return { groups: groupsOut, accounts: accountsOut };
}
const normName = s => String(s || '').toLowerCase().replace(/[\s_:.,\-–—]+/g, '');
function totals() {
  const by = {};
  accounts().forEach(a => { const c = a.cur || 'RUB'; by[c] = (by[c] || 0) + (Number(a.amount) || 0); });
  const base = settings().base || 'RUB';
  let sum = 0;
  const missing = [];
  Object.keys(by).forEach(c => {
    const r = rateTo(c, base);
    if (r > 0) sum += by[c] * r; else missing.push(c);

  return { by, base, sum, missing };
}

}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || el === document.activeElement) return;
  if (typeof f.value === 'string' && 'value' in el) el.value = f.value;
  el.focus({ preventScroll: true });

}

/* ================= Суммы со скриншота ================= */
const OCR_BASE = () => new URL('lib/ocr/', location.href).href;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'lib/ocr/tesseract.min.js';
    s.onload = () => (window.Tesseract ? resolve(window.Tesseract) : reject(new Error('ocr')));
    s.onerror = () => reject(new Error('ocr'));
    document.head.appendChild(s);
  });
}
/* Готовим картинку: оттенки серого, тёмную тему переворачиваем в светлую */
function prepareImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        // скриншоты распознаются лучше всего в исходном размере; маленькие картинки увеличиваем, огромные уменьшаем
        const big = Math.max(img.naturalWidth, img.naturalHeight);
        const k = img.naturalWidth < 900 ? 2 : big > 4200 ? 4200 / big : 1;
        const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        const d = ctx.getImageData(0, 0, w, h);
        const px = d.data;
        let sum = 0;
        for (let i = 0; i < px.length; i += 4) sum += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        const dark = sum / (px.length / 4) < 128;
        for (let i = 0; i < px.length; i += 4) {
          let g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
          if (dark) g = 255 - g;
          px[i] = px[i + 1] = px[i + 2] = g;
        }
        ctx.putImageData(d, 0, 0);
        URL.revokeObjectURL(url);
        resolve(c);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
async function recognize(file, onProgress) {
  const T = await loadTesseract();
  const base = OCR_BASE();
  const worker = await T.createWorker('rus+eng', 1, {
    workerPath: base + 'worker.min.js',
    corePath: base + 'core',
    langPath: base + 'lang',
    gzip: true,
    logger: m => {
      if (!m || typeof m.progress !== 'number') return;
      const stage = /recogniz/.test(m.status) ? 'Распознаю текст' : /language|traineddata/.test(m.status) ? 'Загружаю модуль распознавания' : 'Готовлю распознавание';
      const p = /recogniz/.test(m.status) ? 0.5 + m.progress * 0.5 : m.progress * 0.5;
      onProgress(stage, p);
    }
  });
  try {
    // режим «разрозненный текст»: плитки в две колонки не склеиваются в одну строку
    await worker.setParameters({ tessedit_pageseg_mode: '11' });
    const canvas = await prepareImage(file);
    onProgress('Распознаю текст', 0.5);
    const { data } = await worker.recognize(canvas);
    return data.text || '';
  } finally {
    worker.terminate();
  }
}

/* Сопоставление: латинские и кириллические «двойники» считаем одной буквой */
const LAT2CYR = { a: 'а', c: 'с', e: 'е', h: 'н', k: 'к', m: 'м', o: 'о', p: 'р', t: 'т', x: 'х', y: 'у' };
const normOcr = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[a-z]/g, ch => LAT2CYR[ch] || ch).replace(/[^a-zа-я0-9%]/g, '');
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const CUR_MARK = /((руб|р\.|₽|\$|€|£|eur|usd|rub|ру6|py6|pуб)\.?|\d\s*[рpP<])\s*$/i;
/* Сумма в конце строки: «85 000,00 руб», «20] 10 000,00 руб», «2 700.000 €» */
function amountAtEnd(line) {
  const m = String(line).replace(/[−–]/g, '-').match(/(-?(?:\d{1,3}(?:[ \u00a0\u202f]\d{3})+|\d+)(?:[.,]\d{1,3})?)\s*[^\d\s]{0,5}\.?\s*$/);
  if (!m) return null;
  let s = m[1].replace(/[ \u00a0\u202f]/g, '').replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? Math.round(v * 100) / 100 : null;
}
function matchScan(text) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const accs = accounts();
  const names = accs.map(a => ({ a, keys: [a.name].concat(a.aliases || []).map(normOcr).filter(k => k.length >= 2) }));
  // для каждой строки — лучший счёт
  const lineAcc = lines.map(line => {
    const nl = normOcr(line.replace(/[.…]+\s*$/, ''));
    if (nl.length < 2) return null;
    let best = null;
    names.forEach(({ a, keys }) => keys.forEach(k => {
      let score = 0;
      if (nl === k) score = 4;
      else if (k.length >= 3 && nl.indexOf(k) >= 0) score = 3;
      else if (nl.length >= 6 && k.indexOf(nl) === 0) score = 2;
      else if (k.length >= 5 && lev(nl, k) <= (k.length >= 10 ? 2 : 1)) score = 1;
      if (score && (!best || score > best.score || (score === best.score && k.length > best.len))) best = { a, score, len: k.length };
    }));
    return best;
  });
  // строки-суммы: есть знак валюты или строка почти целиком из цифр
  const isAmountLine = l => {
    if (amountAtEnd(l) === null) return false;
    if (CUR_MARK.test(l)) return true;
    const t = l.replace(/\s/g, '');
    return t.length > 0 && (t.match(/\d/g) || []).length / t.length >= 0.6;
  };
  const result = new Map();
  const taken = new Set();
  const assign = (a, v) => { if (!result.has(a.id)) result.set(a.id, v); };
  // 1. сумма в той же строке, что и название
  lines.forEach((line, i) => {
    const hit = lineAcc[i];
    if (hit && CUR_MARK.test(line) && normOcr(line).length > hit.len + 2) {
      const v = amountAtEnd(line);
      if (v !== null) { assign(hit.a, v); taken.add(i); }
    }
  });
  // 2. серия названий подряд, затем суммы в том же порядке (список и плитки в две колонки)
  let i = 0;
  while (i < lines.length) {
    if (!lineAcc[i] || taken.has(i)) { i++; continue; }
    const run = [];
    let j = i;
    while (j < lines.length && run.length < 4) {
      if (lineAcc[j] && !taken.has(j)) { if (!result.has(lineAcc[j].a.id)) run.push(lineAcc[j].a); j++; continue; }
      // между названиями допускаем одну «мусорную» строку (иконки)
      if (j + 1 < lines.length && lineAcc[j + 1] && !taken.has(j + 1) && !isAmountLine(lines[j])) { j++; continue; }
      break;
    }
    const amounts = [];
    let k = j, skipped = 0;
    while (k < lines.length && amounts.length < run.length && skipped <= 2) {
      if (lineAcc[k]) break;
      if (isAmountLine(lines[k])) { amounts.push(amountAtEnd(lines[k])); taken.add(k); }
      else skipped++;
      k++;
    }
    run.forEach((a, n) => { if (n < amounts.length) assign(a, amounts[n]); });
    // 3. если ниже ничего — сумма строкой выше (банки, где сумма над названием)
    if (!amounts.length && run.length === 1 && i > 0 && !lineAcc[i - 1] && !taken.has(i - 1) && CUR_MARK.test(lines[i - 1])) {
      assign(run[0], amountAtEnd(lines[i - 1])); taken.add(i - 1);
    }
    i = Math.max(j, i + 1);
  }
  return accs.map(a => ({ a, amount: result.has(a.id) ? result.get(a.id) : null }));
}

        '<details class="raw"><summary>Распознанный текст</summary><pre>' + esc(data.text) + '</pre></details>' +
        '<div class="actions"><div class="r"><button type="button" class="btn" data-action="close-sheet">Закрыть</button></div></div>'));
}
async function runScan(file) {

  scanSheet('progress');
  try {
    const text = await recognize(file, (stage, p) => {
      const st = document.getElementById('scanStage'), bar = document.getElementById('scanBar');
      if (st) st.textContent = stage + '…';
      if (bar) bar.style.width = Math.round(Math.min(1, Math.max(0, p)) * 100) + '%';
    });
    scanLast = { text, rows: matchScan(text) };
    scanSheet('result', scanLast);
  } catch (e) {
    scanSheet('error', navigator.onLine === false
      ? 'Нужен интернет: модуль распознавания ещё не загружен на это устройство.'
      : 'Не получилось распознать снимок. Попробуйте ещё раз или другой скриншот.');
  }
}

/* ================= Тост ================= */
let toastTimer = null;
function toast(msg, opt) {
  opt = opt || {};
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (opt.action ? '<button type="button" class="link" id="toastAct">' + esc(opt.action) + '</button>' : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (opt.action) $('#toastAct').onclick = () => { t.classList.remove('show'); opt.onAction(); };
  toastTimer = setTimeout(() => t.classList.remove('show'), opt.action ? 6000 : 3200);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); } return false; }
}

/* ================= События ================= */
document.addEventListener('click', e => {
  if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
  if (openSwipe && !e.target.closest('.swipe-act')) { closeSwipe(); e.preventDefault(); return; }
  if (e.target.closest('a[href]')) return;
  if (e.target === $('#sheet')) { closeSheet(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;

  switch (a) {
    case 'mode': ui.mode = el.dataset.mode; ui.adding = null; saveUi(); render(); break;
    case 'goals-add': goalsAddSheet(); break;
    case 'add-in':
      ui.adding = ui.adding === id ? null : id;
      render();
      if (ui.adding) { const inp = document.getElementById('add-' + id); if (inp) inp.focus(); }
      break;
    case 'scan': { const inp = $('#scanFile'); inp.value = ''; inp.click(); break; }
    case 'money-toggle': ui.moneyOpen = !ui.moneyOpen; saveUi(); render(); break;
    case 'swipe-del': {
      const r = getRec(id);
      closeSwipe();
      if (!r) break;
      if (r.kind === 'item') archiveItem(id);
      else withUndo([id], 'Счёт «' + r.name + '» удалён', () => delRec(id));
      break;
    }
    case 'toggle-focus': toggle(id, 'focus'); break;
    case 'open-archive': archiveSheet(); break;
    case 'restore-item': restoreItem(id); toast('Цель возвращена'); archiveSheet(); break;
    case 'purge-item': {
      const r = getRec(id);
      if (!r) break;
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Точно?'; el.style.width = 'auto'; el.style.padding = '0 8px'; el.style.color = 'var(--danger)'; break; }
      withUndo([id], '«' + r.title + '» удалена насовсем', () => delRec(id));
      archiveSheet();
      break;
    }

    case 'edit-item': itemSheet(id); break;
    case 'delete-item': closeSheet(); archiveItem(id); break;

    case 'new-group': closeSheet(); groupSheet(null); break;
    case 'edit-group': groupSheet(id); break;
    case 'group-up': case 'group-down': moveRec(id, a === 'group-up' ? -1 : 1, groups()); break;
    case 'delete-group': {
      closeSheet();
      const its = live('item').filter(i => i.group === id);
      const ids = [id].concat(its.map(i => i.id));
      withUndo(ids, 'Группа удалена, цели в архиве', () => putMany([[id, null]].concat(its.map(i => [i.id, isArchived(i) ? Object.assign({}, i, { groupName: i.groupName || groupNameOf(id) }) : archivePatch(i)]))));
      break;
    }
    case 'open-import': closeSheet(); importSheet(); break;

    case 'new-account': accountSheet(null); break;
    case 'edit-account': accountSheet(id); break;
    case 'acc-up': case 'acc-down': moveRec(id, a === 'acc-up' ? -1 : 1, accounts()); break;
    case 'delete-account': closeSheet(); withUndo([id], 'Счёт удалён', () => delRec(id)); break;

    case 'close-sheet': closeSheet(); break;
    case 'open-settings': settingsSheet(); break;
    case 'sync-now': sync(); break;
    case 'refresh-fx':
      fetchFx(true).then(ok => {
        toast(ok ? 'Курсы обновлены: ' + fx.source + (fxDateText() ? ' на ' + fxDateText() : '') : 'Не удалось загрузить курсы, проверьте интернет');
        if ($('#sheet').dataset.kind === 'settings' && $('#sheet').classList.contains('open')) settingsSheet();
      });
      render();
      break;
    case 'disconnect':
      cfg = { url: '', key: '' };
      saveCfg();
      setSync('off');
      closeSheet();
      toast('Синхронизация отключена, данные остались на устройстве');
      break;
    case 'copy-link':
      copyText(setupLink()).then(ok => toast(ok ? 'Ссылка скопирована. Не пересылайте её посторонним: в ней ключ доступа' : 'Скопировать не удалось'));
      break;
    case 'copy-backup': {
      const out = {};
      Object.keys(state.records).forEach(k => { if (!state.records[k].del) out[k] = state.records[k]; });
      const text = JSON.stringify({ app: 'life-organizer', v: 3, exported: new Date().toISOString(), records: out });
      copyText(text, $('#bkOut')).then(ok => toast(ok ? 'Копия скопирована в буфер обмена' : 'Выделите текст в поле и скопируйте вручную'));
      break;
    }
    case 'restore': {
      const inp = $('#bkIn'); if (!inp) break;
      let parsed;
      try { parsed = JSON.parse(inp.value); } catch (err) { inp.classList.add('err'); toast('Текст не похож на резервную копию'); break; }
      const src = parsed && parsed.records && typeof parsed.records === 'object' ? parsed.records : null;
      if (!src) { inp.classList.add('err'); toast('В копии нет данных'); break; }
      const entries = Object.keys(src)
        .filter(k => src[k] && typeof src[k] === 'object' && KINDS.includes(src[k].kind) && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(k))
        .map(k => [k, src[k]]);
      if (!entries.length) { toast('В копии нет подходящих записей'); break; }
      closeSheet();
      putMany(entries);
      toast('Восстановлено записей: ' + entries.length);
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet').classList.contains('open')) { closeSheet(); return; }
  if (e.key === 'Escape' && ui.adding && e.target.closest && e.target.closest('.add-item')) { ui.adding = null; render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();

  if (f.classList.contains('add-item')) {
    const inp = f.querySelector('input'); const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    addItem(f.dataset.group, text);
    return;
  }

  if (f.id === 'fItem') {
    const title = $('#fTitle').value.trim(); if (!title) return;
    const ex = getRec(f.dataset.id); if (!ex) { closeSheet(); return; }
    const g = $('#fGroup');
    closeSheet();
    setRec(Object.assign({}, ex, { title, details: $('#fDetails').value.trim(), group: g ? g.value : ex.group, focus: $('#fFocus').checked }));
    return;
  }

  if (f.id === 'fGroupForm') {
    const name = $('#fName').value.trim(); if (!name) return;
    const id = f.dataset.id;
    closeSheet();
    const ex = id && getRec(id);
    if (ex) setRec(Object.assign({}, ex, { name }));
    else {
      ui.adding = null;
      const gid = addGroup(name);
      ui.adding = gid;
      if (ui.mode !== 'all') { ui.mode = 'all'; saveUi(); }
      render();
      setTimeout(() => { const inp = document.getElementById('add-' + gid); if (inp) inp.focus(); }, 50);
    }
    return;
  }

  if (f.id === 'fImport') {
    const parsed = parseOutline($('#fText').value);
    if (!parsed.groups.length && !parsed.accounts.length) { $('#fText').classList.add('err'); return; }
    const existingGroups = groups();
    const existingItems = live('item');
    const existingAccs = accounts();
    let gOrder = nextOrder('group'), aOrder = nextOrder('account');
    const entries = [];
    let newGroups = 0, newItems = 0, newAccs = 0, updAccs = 0, updItems = 0;
    const now = Date.now();
    parsed.groups.forEach(pg => {
      const g = existingGroups.find(x => normName(x.name) === normName(pg.name));
      let gid;
      if (g) gid = g.id;
      else {
        gid = newId('g');
        entries.push([gid, { kind: 'group', name: pg.name, order: gOrder++, createdAt: now }]);
        newGroups++;
      }
      pg.items.forEach((it, k) => {
        const p = splitTitle(it.text);
        if (!p.title) return;
        const same = existingItems.find(x => x.group === gid && normName(x.title) === normName(p.title));
        if (same) {
          // уже есть: только отмечаем «в работе», если это указано
          if (it.focus && !same.focus && !isArchived(same)) { entries.push([same.id, Object.assign({}, same, { focus: true })]); updItems++; }
          return;
        }
        entries.push([newId('i') + k, { kind: 'item', group: gid, title: p.title, details: p.details, focus: it.focus, done: false, doneAt: null, createdAt: now + k }]);
        newItems++;
      });
    });
    parsed.accounts.forEach((a, k) => {
      const same = existingAccs.find(x => normName(x.name) === normName(a.name));
      if (same) {
        const cur = a.cur || same.cur || 'RUB';
        if (same.amount !== a.amount || same.cur !== cur) { entries.push([same.id, Object.assign({}, same, { amount: a.amount, cur, at: now })]); updAccs++; }
        return;
      }
      entries.push([newId('a') + k, { kind: 'account', name: a.name, amount: a.amount, cur: a.cur || settings().base || 'RUB', note: '', order: aOrder++, createdAt: now + k, at: now }]);
      newAccs++;
    });
    closeSheet();
    if (ui.mode !== 'all') { ui.mode = 'all'; saveUi(); }
    const parts = [];
    if (newGroups) parts.push('групп ' + newGroups);
    if (newItems) parts.push('целей ' + newItems);
    if (newAccs) parts.push('счетов ' + newAccs);
    const upd = updAccs + updItems;
    if (!entries.length) { toast('Всё это уже есть в органайзере'); return; }
    const ids = entries.map(x => x[0]);
    withUndo(ids, (parts.length ? 'Добавлено: ' + parts.join(', ') : 'Готово') + (upd ? ' · обновлено: ' + upd : ''), () => putMany(entries));
    return;
  }

  if (f.id === 'fScan') {
    const now = Date.now();
    const entries = [];
    f.querySelectorAll('input[name="acc"]:checked').forEach(inp => {
      const a = getRec(inp.value);
      if (a) entries.push([a.id, Object.assign({}, a, { amount: Number(inp.dataset.amount), at: now })]);
    });
    closeSheet();
    if (!entries.length) return;
    const ids = entries.map(x => x[0]);
    withUndo(ids, 'Обновлено счетов: ' + entries.length, () => putMany(entries));
    return;
  }

  if (f.id === 'fAccount') {
    const name = $('#fName').value.trim(); if (!name) return;
    const amount = evalAmount($('#fAmount').value);
    if (amount === null) { $('#fAmount').classList.add('err'); $('#fAmount').focus(); toast('Не получилось прочитать сумму'); return; }
    const id = f.dataset.id;
    const ex = id && getRec(id);
    const aliases = $('#fAliases').value.split(',').map(x => x.trim()).filter(Boolean);
    const body = { name, amount, cur: $('#fCur').value, note: $('#fNote').value.trim(), aliases };
    closeSheet();
    if (ex) setRec(Object.assign({}, ex, body, { at: ex.amount !== amount || ex.cur !== body.cur ? Date.now() : (ex.at || Date.now()) }));
    else setRec(Object.assign({ id: newId('a'), kind: 'account', order: nextOrder('account'), createdAt: Date.now(), at: Date.now() }, body));
    return;
  }

  if (f.id === 'fMoney') {
    const rates = Object.assign({}, settings().rates || {});
    const auto = $('#fAuto').checked;
    let bad = false;
    if (!auto) f.querySelectorAll('[data-cur]').forEach(inp => {
      const raw = inp.value.trim();
      if (!raw) { delete rates[inp.dataset.cur]; return; }
      const v = evalAmount(raw);
      if (!v || v <= 0) { inp.classList.add('err'); bad = true; return; }
      rates[inp.dataset.cur] = v;
    });
    if (bad) return;
    const base = $('#fBase').value;
    const prevBase = settings().base || 'RUB';
    setRec(Object.assign({ id: 'settings', kind: 'settings' }, settings(), { base, autoRates: auto, rates: base !== prevBase ? {} : rates }));
    if (auto) fetchFx(false);
    if (base !== prevBase && !auto) { settingsSheet(); toast('Валюта итога изменена, укажите курсы заново'); }
    else { closeSheet(); toast('Сохранено'); }
    return;
  }

  if (f.id === 'fConnect') {
    const btn = f.querySelector('[type="submit"]');
    btn.disabled = true;
    connect($('#cUrl').value, $('#cKey').value).then(ok => {
      btn.disabled = false;
      if (ok && $('#sheet').dataset.kind === 'settings') settingsSheet();
    });
  }
});

document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('err')) e.target.classList.remove('err'); });
document.addEventListener('change', e => {
  if (e.target.id === 'scanFile' && e.target.files && e.target.files[0]) { runScan(e.target.files[0]); return; }
  if (e.target.id === 'fAuto') { $('#fxAutoBox').hidden = !e.target.checked; $('#fxManualBox').hidden = e.target.checked; }
});

/* Закрыть пустое поле новой цели, когда фокус ушёл */
document.addEventListener('focusout', e => {
  const f = e.target.closest && e.target.closest('.add-item');
  if (!f || e.target.value.trim()) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (ui.adding && !(a && a.closest && (a.closest('.add-item') || a.dataset.action === 'add-in'))) { ui.adding = null; render(); }
  }, 150);
});

/* ================= Свайп влево: удалить ================= */
const SWIPE_W = 96;
let sw = null, openSwipe = null, suppressClickUntil = 0;
function closeSwipe(row) {
  row = row || openSwipe;
  if (!row) return;
  row.style.transform = '';
  const box = row.closest('.swipe');
  if (box) setTimeout(() => box.classList.remove('open', 'moving'), 200);
  if (openSwipe === row) openSwipe = null;
}
document.addEventListener('touchstart', e => {
  const row = e.target.closest('.swipe-row');
  if (openSwipe && openSwipe !== row && !e.target.closest('.swipe-act')) closeSwipe();
  if (!row || e.touches.length !== 1) { sw = null; return; }
  const t = e.touches[0];
  sw = { row, x0: t.clientX, y0: t.clientY, dx: 0, base: row === openSwipe ? -SWIPE_W : 0, decided: false, moving: false };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!sw) return;
  const t = e.touches[0];
  const dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
  if (!sw.decided) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    sw.decided = true;
    sw.moving = Math.abs(dx) > Math.abs(dy) * 1.2 && (dx < 0 || sw.base < 0);
    if (sw.moving) sw.row.closest('.swipe').classList.add('moving');
  }
  if (!sw.moving) return;
  e.preventDefault();
  sw.dx = dx;
  const x = Math.max(-SWIPE_W * 1.5, Math.min(0, sw.base + dx));
  sw.row.style.transition = 'none';
  sw.row.style.transform = 'translateX(' + x + 'px)';
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.moving) return;
  suppressClickUntil = Date.now() + 350;
  s.row.style.transition = '';
  if (s.base + s.dx < -SWIPE_W / 2) {
    if (openSwipe && openSwipe !== s.row) closeSwipe();
    s.row.style.transform = 'translateX(' + (-SWIPE_W) + 'px)';
    s.row.closest('.swipe').classList.add('open');
    openSwipe = s.row;
  } else {
    closeSwipe(s.row);
  }
});
document.addEventListener('touchcancel', () => { if (sw && sw.moving) closeSwipe(sw.row); sw = null; });

window.addEventListener('storage', e => {
  if (e.key === LS_DATA) { state = loadState(); render(); }
  if (e.key === LS_CFG) { cfg = loadCfg(); setSync(configured() ? 'ok' : 'off'); }
});
window.addEventListener('online', () => sync());
window.addEventListener('offline', () => { if (configured()) setSync('offline'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); sync(); if (autoRates()) fetchFx(false); } });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);

/* ================= Запуск ================= */
/* Ссылки вида #setup=… (подключение) и #import=… (готовый список) */
function readHashLink() {
  const h = location.hash.slice(1);
  let setup = null, imp = '';
  if (h.indexOf('setup=') === 0) {
    try { const c = JSON.parse(b64urlDecode(h.slice(6))); if (c && c.url && c.key) setup = c; } catch (e) {}
  } else if (h.indexOf('import=') === 0) {
    try { imp = b64urlDecode(h.slice(7)); } catch (e) {}
  } else return null;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  return { setup, imp };
}
function openImportWith(text) {
  importSheet();
  const ta = $('#fText');
  if (ta) ta.value = text;
}
window.addEventListener('hashchange', () => {
  const link = readHashLink();
  if (!link) return;
  if (link.imp) openImportWith(link.imp);
  if (link.setup) connect(link.setup.url, link.setup.key);
});

async function init() {
  const link = readHashLink();
  render();
  if (link && link.imp) openImportWith(link.imp);
  setSync(configured() ? 'ok' : 'off');

  if (autoRates()) fetchFx(false);
  if (link && link.setup) await connect(link.setup.url, link.setup.key);
  else sync();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

init();
})();
</script>
