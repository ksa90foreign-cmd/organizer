<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Органайзер</title>
<meta name="description" content="Цели по группам и деньги по счетам с синхронизацией через Google Диск">
<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Органайзер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: один экран. Телефон — колонка (цели, затем деньги); от 960px — две колонки: цели слева, деньги справа */
  --bg:#f1f2f4;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --ink:#15171c;
  --muted:#6a707d;
  --faint:#9aa0ab;
  --line:#e3e5ea;
  --accent:#2b3fd1;
  --accent-ink:#ffffff;
  --accent-soft:#e7eafc;
  --ok:#17845a;
  --danger:#c3352b;
  --star:#d49a0b;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014;
    --surface:#16191f;
    --surface-2:#1c2028;
    --ink:#e9ebf0;
    --muted:#959bab;
    --faint:#666c7a;
    --line:#262a33;
    --accent:#8a97ff;
    --accent-ink:#0e1014;
    --accent-soft:#222746;
    --ok:#4fc58f;
    --danger:#ff7468;
    --star:#f0b93a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014;
  --surface:#16191f;
  --surface-2:#1c2028;
  --ink:#e9ebf0;
  --muted:#959bab;
  --faint:#666c7a;
  --line:#262a33;
  --accent:#8a97ff;
  --accent-ink:#0e1014;
  --accent-soft:#222746;
  --ok:#4fc58f;
  --danger:#ff7468;
  --star:#f0b93a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Каркас ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.015em}
.top .date{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.top-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sync{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="loading"] i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.sync[data-s="offline"] i{background:var(--star)}
.sync[data-s="error"] i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;flex:0 0 auto;padding:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start;gap:20px}
  .money{position:sticky;top:16px}
  .top h1{font-size:26px}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner p{margin:0;flex:1 1 220px}

/* ---------- Переключатели и кнопки ---------- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg .n{font-family:var(--font-num);font-size:11.5px;margin-left:4px;opacity:.7}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13.5px}
.link{background:none;border:0;color:var(--accent);font-size:13.5px;font-weight:500;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.link.muted{color:var(--muted);font-weight:400}
.foot-links{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0 4px}

/* ---------- Группы и цели ---------- */
.group{padding:6px 0 4px;border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group-h{display:flex;align-items:center;gap:8px;padding:6px 0 2px}
.group-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em;cursor:pointer;overflow-wrap:anywhere}
.group-h .cnt{font-family:var(--font-num);font-size:12px;color:var(--faint)}
.group-h .icon-btn{margin-left:auto;width:30px;height:30px}
.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:10px;padding:7px 0 7px 10px;margin-left:-10px;border-left:2px solid transparent}
.item.focus{border-left-color:var(--star)}
.check{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--faint);background:none;display:grid;place-items:center;cursor:pointer;margin-top:1px;padding:0;color:#fff}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:12px;height:12px}
.txt{flex:1;min-width:0;cursor:pointer}
.txt .t{overflow-wrap:anywhere}
.item.focus .txt .t{font-weight:500}
.txt .d{display:block;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.star{flex:0 0 auto;background:none;border:0;cursor:pointer;color:var(--faint);padding:0 2px;width:30px;height:24px;display:grid;place-items:center;opacity:.55}
.star:hover{opacity:1;color:var(--star)}
.star.on{color:var(--star);opacity:1}
.star svg{width:18px;height:18px}
.add-item{display:flex;align-items:center;gap:10px;padding:4px 0 6px}
.add-item .plus{flex:0 0 20px;text-align:center;color:var(--faint);font-size:18px;line-height:1}
.add-item input{flex:1;min-width:0;border:0;background:none;padding:5px 0;font-size:15px;outline:none;border-bottom:1px solid transparent}
.add-item input:focus{border-bottom-color:var(--accent)}
.add-item input::placeholder{color:var(--faint)}
.done-toggle{margin:2px 0 4px 30px;font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* ---------- Деньги ---------- */
.total{padding:6px 0 10px;border-bottom:1px solid var(--line)}
.total .big{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.total .sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.total .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.acc{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.acc:last-child{border-bottom:0}
.acc .name{min-width:0;overflow-wrap:anywhere}
.acc .note{display:block;font-size:12.5px;color:var(--muted)}
.acc .amt{white-space:nowrap;font-weight:500;text-align:right}
.acc .amt.neg{color:var(--danger)}
.acc .when{display:block;font-size:11.5px;color:var(--faint);font-family:var(--font-body);font-weight:400}

/* ---------- Лист ---------- */
.sheet-wrap{position:fixed;inset:0;background:rgba(8,10,14,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-wrap.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:14px}
.sheet h3{font-size:14px;font-weight:600}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:16px;padding:22px}}
.form{display:grid;gap:12px}
.form label,.form .lbl{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.inp{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.err{border-color:var(--danger)}
textarea.inp{resize:vertical;min-height:70px}
select.inp{appearance:auto}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto}
.actions.start{justify-content:flex-start}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint code{font-family:var(--font-num);font-size:12px;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.sep{border:0;border-top:1px solid var(--line);margin:8px 0}
.status-line{display:flex;align-items:center;gap:8px;font-size:13.5px}
.status-line i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.status-line[data-s="ok"] i{background:var(--ok)}
.status-line[data-s="error"] i{background:var(--danger)}
.status-line[data-s="offline"] i{background:var(--star)}
.status-line[data-s="loading"] i{background:var(--accent)}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:12px;width:max-content;max-width:100%}
.qr svg{display:block;width:200px;height:200px}
.check-line{display:flex !important;grid-template-columns:none;align-items:center;gap:10px;color:var(--ink) !important;font-size:15px !important;cursor:pointer}
.check-line input{width:18px;height:18px;accent-color:var(--star)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .link{color:var(--bg);text-decoration:underline;font-size:14px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Органайзер</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="top-r">
      <button type="button" class="sync" id="sync" data-action="open-settings" data-s="off"><i></i><span id="syncText">Не настроено</span></button>
      <button type="button" class="icon-btn" data-action="open-settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
    </div>
  </header>

  <div class="banner" id="setupBanner" hidden>
    <p>Синхронизация с Google Диском не настроена: данные пока только на этом устройстве.</p>
    <button type="button" class="btn primary sm" data-action="open-settings">Настроить</button>
  </div>

  <div class="layout">
    <section class="panel goals" aria-labelledby="goalsH">
      <div class="sec-h">
        <h2 id="goalsH">Цели</h2>
        <div class="seg" role="group" aria-label="Что показывать">
          <button type="button" data-action="mode" data-mode="focus" id="modeFocus">В работе<span class="n" id="focusCount">0</span></button>
          <button type="button" data-action="mode" data-mode="all" id="modeAll">Все</button>
        </div>
      </div>
      <div id="groups"></div>
      <div class="foot-links" id="goalLinks">
        <button type="button" class="link" data-action="new-group">+ Группа</button>
        <button type="button" class="link muted" data-action="open-import">Вставить список из заметок</button>
      </div>
    </section>

    <section class="panel money" aria-labelledby="moneyH">
      <div class="sec-h">
        <h2 id="moneyH">Деньги</h2>
        <button type="button" class="link" data-action="new-account">+ Счёт</button>
      </div>
      <div id="totals"></div>
      <div id="accounts"></div>
    </section>
  </div>
</div>

<div class="sheet-wrap" id="sheet" role="dialog" aria-modal="true" aria-label="Редактирование">
  <div class="sheet" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= Справочники ================= */
const CURRENCIES = { RUB: '₽', EUR: '€', USD: '$', TRY: '₺', CNY: '¥', GBP: '£' };
const CUR_NAMES = { RUB: 'Рубли', EUR: 'Евро', USD: 'Доллары', TRY: 'Лиры', CNY: 'Юани', GBP: 'Фунты' };
const KINDS = ['group', 'item', 'account', 'settings', 'task', 'goal', 'tx'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const LS_DATA = 'organizer.data.v2';
const LS_CFG = 'organizer.config.v1';
const LS_UI = 'organizer.ui.v1';
const QR_LIB = 'lib/qrcode.js';

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg>',
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>'
};

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const newId = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function ymd(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtTime(ms) {
  if (!ms) return 'ещё не было';
  const d = new Date(ms);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const t = ymd(), dd = ymd(d);
  const y = new Date(); y.setDate(y.getDate() - 1);
  const day = dd === t ? 'сегодня' : dd === ymd(y) ? 'вчера' : d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
  return day + ' в ' + hm;
}
function ago(ms) {
  if (!ms) return '';
  const days = Math.floor((Date.now() - ms) / 86400000);
  if (days < 1) return 'сегодня';
  if (days === 1) return 'вчера';
  if (days < 30) return days + ' ' + plural(days, ['день', 'дня', 'дней']) + ' назад';
  const d = new Date(ms);
  return d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
}
function plural(n, f) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const fmtMoney = (n, cur) => (n < 0 ? '−' : '') + nf.format(Math.abs(Math.round(n * 100) / 100)) + ' ' + (CURRENCIES[cur] || cur || '');
function evalAmount(s) {
  s = String(s == null ? '' : s).replace(/[\s ]/g, '').replace(/,/g, '.').replace(/[−–]/g, '-').replace(/[×х]/g, '*').replace(/:/g, '/');
  if (!s) return null;
  if (!/^[0-9+\-*/().]+$/.test(s)) return null;
  try {
    const v = Function('"use strict";return (' + s + ')')();
    return typeof v === 'number' && isFinite(v) ? Math.round(v * 100) / 100 : null;
  } catch (e) { return null; }
}
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* «Кривоколенный ( АГР ( ТЭП, оформление ))» → название и уточнение */
function splitTitle(s) {
  s = String(s || '').trim();
  const i = s.indexOf('(');
  if (i > 0 && s.endsWith(')')) {
    return { title: s.slice(0, i).trim(), details: s.slice(i + 1, s.length - 1).trim() };
  }
  return { title: s, details: '' };
}
/* Текст с автоматическими ссылками */
function richText(s) {
  const re = /(https?:\/\/[^\s<>"']+[^\s<>"'.,;:)\]])/g;
  let out = '', last = 0, m;
  const str = String(s || '');
  while ((m = re.exec(str))) {
    out += esc(str.slice(last, m.index));
    let label = m[1].replace(/^https?:\/\/(www\.)?/, '');
    if (label.length > 40) label = label.slice(0, 38) + '…';
    out += '<a href="' + esc(m[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + '</a>';
    last = m.index + m[1].length;
  }
  return out + esc(str.slice(last));
}

/* ================= Хранение на устройстве ================= */
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_DATA) || 'null');
    if (s && s.records && typeof s.records === 'object') {
      return { records: s.records, dirty: s.dirty || {}, rev: s.rev || 0, lastSync: s.lastSync || 0 };
    }
  } catch (e) {}
  return { records: {}, dirty: {}, rev: 0, lastSync: 0 };
}
function saveState() {
  try { localStorage.setItem(LS_DATA, JSON.stringify(state)); }
  catch (e) { toast('Память браузера заполнена: изменения могут не сохраниться'); }
}
function loadCfg() {
  try { const c = JSON.parse(localStorage.getItem(LS_CFG) || 'null'); if (c && c.url && c.key) return { url: c.url, key: c.key }; } catch (e) {}
  return { url: '', key: '' };
}
function saveCfg() { try { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch (e) {} }
function loadUi() {
  try { const u = JSON.parse(localStorage.getItem(LS_UI) || 'null'); if (u) return u; } catch (e) {}
  return {};
}
function saveUi() { try { localStorage.setItem(LS_UI, JSON.stringify({ mode: ui.mode })); } catch (e) {} }

let state = loadState();
let cfg = loadCfg();
let lastU = 0;
const ui = { mode: loadUi().mode === 'focus' ? 'focus' : 'all', showDone: {} };

const live = kind => Object.keys(state.records).map(id => state.records[id]).filter(r => r && r.kind === kind && !r.del);
const getRec = id => { const r = state.records[id]; return r && !r.del ? r : null; };
const settings = () => getRec('settings') || {};
const byOrder = (a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0);
const groups = () => live('group').sort(byOrder);
const accounts = () => live('account').sort(byOrder);
const nextOrder = kind => live(kind).reduce((m, r) => Math.max(m, r.order || 0), 0) + 1;

function nextU() { let t = Date.now(); if (t <= lastU) t = lastU + 1; lastU = t; return t; }
function put(rec) {
  const r = Object.assign({}, rec, { u: nextU() });
  delete r.rv;
  state.records[r.id] = r;
  state.dirty[r.id] = r.u;
}
function commit() { saveState(); render(); scheduleSync(); }
function setRec(rec) { put(rec); commit(); }
function delRec(id) { const ex = state.records[id]; if (!ex) return; put({ id, kind: ex.kind, del: true }); commit(); }
function putMany(entries) {
  entries.forEach(([id, body]) => {
    if (body && !body.del) put(Object.assign({}, body, { id }));
    else { const ex = state.records[id]; if (ex && !ex.del) put({ id, kind: ex.kind, del: true }); }
  });
  commit();
}
function withUndo(ids, label, fn) {
  const before = ids.map(id => [id, state.records[id] && !state.records[id].del ? clone(state.records[id]) : null]);
  fn();
  toast(label, { action: 'Вернуть', onAction: () => putMany(before) });
}

/* ================= Синхронизация с Google Диском ================= */
let syncing = false, again = false, syncTimer = null, syncState = 'off', lastError = '';
const configured = () => !!(cfg.url && cfg.key);

function setSync(s, err) {
  syncState = s;
  if (s === 'error') lastError = err || lastError; else if (s === 'ok') lastError = '';
  const el = $('#sync');
  el.dataset.s = s;
  $('#syncText').textContent = { off: 'Не настроено', ok: 'Google Диск', loading: 'Синхронизация', offline: 'Офлайн', error: 'Ошибка' }[s];
  el.title = s === 'error' ? lastError : '';
  $('#setupBanner').hidden = configured();
  const line = document.getElementById('syncLine');
  if (line) { line.dataset.s = s; line.querySelector('span').textContent = syncLineText(); }
}
function syncLineText() {
  if (!configured()) return 'Не подключено';
  if (syncState === 'loading') return 'Синхронизация…';
  if (syncState === 'offline') return 'Нет интернета. Изменения сохранены на устройстве и отправятся позже.';
  if (syncState === 'error') return 'Ошибка: ' + lastError;
  const pend = Object.keys(state.dirty).length;
  return 'Последняя синхронизация ' + fmtTime(state.lastSync) + (pend ? ' · ждут отправки: ' + pend : '');
}
function explainError(e) {
  const m = e && e.message;
  if (m === 'auth') return 'неверный ключ доступа';
  if (m === 'not_setup') return 'в скрипте не выполнена функция setup';
  if (m === 'busy') return 'сервер занят, повтор через минуту';
  if (m === 'badjson') return 'адрес не похож на скрипт органайзера (проверьте доступ «Все»)';
  if (m && m.indexOf('http') === 0) return 'сервер ответил ' + m.slice(5);
  return 'нет связи со скриптом';
}

async function callApi(payload, conf) {
  conf = conf || cfg;
  const res = await fetch(conf.url, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ key: conf.key }, payload))
  });
  if (!res.ok) throw new Error('http ' + res.status);
  const txt = await res.text();
  let data;
  try { data = JSON.parse(txt); } catch (e) { throw new Error('badjson'); }
  if (!data.ok) throw new Error(data.error || 'server');
  return data;
}

function scheduleSync(delay) {
  if (!configured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay == null ? 1200 : delay);
}

async function sync() {
  if (!configured()) { setSync('off'); return; }
  if (syncing) { again = true; return; }
  if (navigator.onLine === false) { setSync('offline'); return; }
  syncing = true;
  setSync('loading');
  const pushed = {};
  const changes = [];
  Object.keys(state.dirty).forEach(id => {
    const r = state.records[id];
    if (r) { pushed[id] = r.u; changes.push(r); } else delete state.dirty[id];
  });
  try {
    const data = await callApi({ action: 'sync', since: state.rev, changes });
    Object.keys(pushed).forEach(id => { if (state.dirty[id] === pushed[id]) delete state.dirty[id]; });
    (data.records || []).forEach(r => {
      if (!r || typeof r.id !== 'string') return;
      const loc = state.records[r.id];
      if (state.dirty[r.id] && loc && (loc.u || 0) > (r.u || 0)) return;
      state.records[r.id] = r;
    });
    state.rev = Math.max(state.rev, data.rev || 0);
    state.lastSync = Date.now();
    saveState();
    render();
    setSync('ok');
  } catch (e) {
    saveState();
    if (navigator.onLine === false) setSync('offline');
    else setSync('error', explainError(e));
  } finally {
    syncing = false;
    if (again) { again = false; scheduleSync(300); }
  }
}

async function connect(url, key) {
  url = (url || '').trim(); key = (key || '').trim();
  const m = url.match(/#setup=([A-Za-z0-9_-]+)/);
  if (m) {
    try {
      const c = JSON.parse(b64urlDecode(m[1]));
      if (c && c.url && c.key) { url = String(c.url).trim(); key = String(c.key).trim(); }
    } catch (e) {}
  }
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast('Адрес должен начинаться с https://script.google.com/'); return false; }
  if (!key) { toast('Вставьте ключ доступа'); return false; }
  setSync('loading');
  try {
    await callApi({ action: 'ping' }, { url, key });
  } catch (e) {
    setSync(configured() ? 'error' : 'off', explainError(e));
    toast('Не удалось подключиться: ' + explainError(e));
    return false;
  }
  const changed = cfg.url !== url || cfg.key !== key;
  cfg = { url, key };
  saveCfg();
  if (changed) {
    state.rev = 0;
    Object.keys(state.records).forEach(id => { state.dirty[id] = state.records[id].u || nextU(); });
    saveState();
  }
  await sync();
  toast('Google Диск подключён');
  return true;
}

function addGroup(name) {

}
function addItem(gid, text) {

  if (!p.title) return;
  setRec({ id: newId('i'), kind: 'item', group: gid, title: p.title, details: p.details, focus: false, done: false, doneAt: null, createdAt: Date.now() });
}
function toggle(id, field) {
  const r = getRec(id); if (!r) return;
  const patch = { [field]: !r[field] };
  if (field === 'done') { patch.doneAt = !r.done ? Date.now() : null; if (!r.done) patch.focus = false; }
  setRec(Object.assign({}, r, patch));
}
function moveRec(id, dir, list) {
  const i = list.findIndex(r => r.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = list[i], b = list[j];
  const oa = a.order || i + 1, ob = b.order || j + 1;
  putMany([[a.id, Object.assign({}, a, { order: ob === oa ? oa + dir : ob })], [b.id, Object.assign({}, b, { order: oa })]]);
}
function parseOutline(text) {
  const blocks = String(text || '').replace(/\r/g, '').split(/\n\s*\n/);
  const out = [];
  blocks.forEach(b => {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const bullet = /^([-•*·–]|\d+[.)])\s*/;
    let name, rest;
    if (bullet.test(lines[0])) { name = 'Разное'; rest = lines; }
    else { name = lines[0].replace(/^#+\s*/, '').replace(/:$/, ''); rest = lines.slice(1); }
    out.push({ name, items: rest.map(l => l.replace(bullet, '').trim()).filter(Boolean) });
  });
  return out;
}
function totals() {
  const by = {};
  accounts().forEach(a => { const c = a.cur || 'RUB'; by[c] = (by[c] || 0) + (Number(a.amount) || 0); });
  const s = settings();
  const base = s.base || 'RUB';
  const rates = s.rates || {};
  let sum = 0, missing = [];
  Object.keys(by).forEach(c => {
    if (c === base) sum += by[c];
    else if (Number(rates[c]) > 0) sum += by[c] * Number(rates[c]);
    else missing.push(c);
  });
  return { by, base, sum, missing };
}

function captureFocus() {
  const a = document.activeElement;
  if (!a || a === document.body || !a.id) return null;
  return { id: a.id, value: 'value' in a ? a.value : null, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || el === document.activeElement) return;
  if (typeof f.value === 'string' && 'value' in el) el.value = f.value;
  el.focus({ preventScroll: true });
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (e) {}
}

function renderGoals() {
  const gs = groups();

  $('#modeFocus').classList.toggle('on', ui.mode === 'focus');

  $('#modeAll').setAttribute('aria-pressed', ui.mode === 'all');

  const known = new Set(gs.map(g => g.id));
  const orphans = items.filter(i => !known.has(i.group));

  if (orphans.length) list.push({ id: '', name: 'Без группы', virtual: true });

  if (!list.length) {
    $('#groups').innerHTML = '<div class="empty">Пока пусто. Создайте группу (например, «Обучение» или «Бюро»), добавьте в неё цели и отметьте звёздочкой то, над чем работаете сейчас. Или вставьте готовый список из заметок.</div>';

    const open = its.filter(i => !i.done).sort((a, b) => (b.focus ? 1 : 0) - (a.focus ? 1 : 0) || (a.createdAt || 0) - (b.createdAt || 0));
    const done = its.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    if (ui.mode === 'focus') {
      const f = open.filter(i => i.focus);

      html += '<div class="group"><div class="group-h"><h3>' + esc(g.name) + '</h3></div><ul class="items">' + f.map(itemRow).join('') + '</ul></div>';
      return;
    }

    html += '<div class="group">' +
      '<div class="group-h"><h3' + (g.virtual ? '' : ' data-action="edit-group" data-id="' + esc(g.id) + '" role="button" tabindex="0"') + '>' + esc(g.name) + '</h3>' +
        '<span class="cnt">' + open.length + '</span>' +
        (g.virtual ? '' : '<button type="button" class="icon-btn" data-action="edit-group" data-id="' + esc(g.id) + '" aria-label="Настроить группу">' + ICON.dots + '</button>') +
      '</div>' +

      (g.virtual ? '' : '<form class="add-item" data-group="' + esc(g.id) + '" autocomplete="off"><span class="plus" aria-hidden="true">+</span><label class="sr" for="add-' + esc(g.id) + '">Добавить цель в группу ' + esc(g.name) + '</label><input id="add-' + esc(g.id) + '" placeholder="Добавить цель" enterkeyhint="done"></form>') +
      (done.length ? '<button type="button" class="link muted done-toggle" data-action="toggle-done-list" data-group="' + esc(gid) + '">' + (ui.showDone[gid] ? 'Скрыть выполненные' : 'Выполнено: ' + done.length) + '</button>' : '') +
    '</div>';
  });
  if (ui.mode === 'focus' && !html) {
    html = '<div class="empty">В работе пока ничего. Переключитесь на «Все» и отметьте звёздочкой цели на ближайшее время.</div>';
  }

function renderMoney() {

    return;
  }
  const t = totals();
  const curs = Object.keys(t.by);

}

function accountSheet(id) {
  const lastCur = (accounts().slice(-1)[0] || {}).cur || settings().base || 'RUB';
  const a = id ? getRec(id) : { name: '', amount: '', cur: lastCur, note: '' };
  if (!a) return;
  openSheet('account',
    '<h2>' + (id ? 'Счёт' : 'Новый счёт') + '</h2>' +
    '<form class="form" id="fAccount" data-id="' + esc(id || '') + '" autocomplete="off">' +
      '<label>Где лежит<input class="inp" id="fName" required placeholder="Карта, наличные, вклад…" value="' + esc(a.name) + '"></label>' +
      '<div class="row2"><label>Сумма<input class="inp num" id="fAmount" inputmode="decimal" required value="' + esc(a.amount) + '"></label>' +
      '<label>Валюта<select class="inp" id="fCur">' + curOptions(a.cur || 'RUB') + '</select></label></div>' +
      '<p class="hint">Можно считать прямо в поле: <code>120000-4500</code> или <code>3*25000</code>.</p>' +
      '<label>Заметка<input class="inp" id="fNote" placeholder="Необязательно" value="' + esc(a.note || '') + '"></label>' +
      (id ? '<div class="actions start"><button type="button" class="btn sm" data-action="acc-up" data-id="' + esc(id) + '">↑ Выше</button><button type="button" class="btn sm" data-action="acc-down" data-id="' + esc(id) + '">↓ Ниже</button></div>' : '') +
      actionsHtml('delete-account', id) +
    '</form>', id ? '#fAmount' : '#fName');
}

function importSheet() {
  openSheet('import',
    '<h2>Вставить список</h2>' +
    '<form class="form" id="fImport" autocomplete="off">' +
      '<p class="hint">Скопируйте текст из заметок. Первая строка каждого блока станет группой, остальные строки — целями. Блоки разделяйте пустой строкой. Текст в скобках станет уточнением.</p>' +
      '<textarea class="inp" id="fText" rows="10" placeholder="Обучение&#10;Написать введение (литература, план)&#10;&#10;Работа&#10;Проект А (чертежи, расчёты)&#10;Проект Б"></textarea>' +
      '<div class="actions"><div class="r"><button type="button" class="btn" data-action="close-sheet">Отмена</button><button type="submit" class="btn primary">Добавить</button></div></div>' +
    '</form>', '#fText');
}

function settingsSheet() {
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const s = settings();
  const base = s.base || 'RUB';
  const used = Object.keys(totals().by).filter(c => c !== base);
  const rates = s.rates || {};
  openSheet('settings',
    '<h2>Настройки</h2>' +
    '<form class="form" id="fMoney" autocomplete="off">' +
      '<h3>Общий итог по деньгам</h3>' +
      '<label>Показывать итог в валюте<select class="inp" id="fBase">' + curOptions(base) + '</select></label>' +
      (used.length
        ? '<div class="rates">' + used.map(c => '<label>1 ' + (CURRENCIES[c] || c) + ' = … ' + CURRENCIES[base] + '<input class="inp num" id="rate-' + c + '" data-cur="' + c + '" inputmode="decimal" placeholder="Курс" value="' + esc(rates[c] || '') + '"></label>').join('') + '</div>' +
          '<p class="hint">Курсы вводите вручную и обновляйте, когда нужно.</p>'
        : '<p class="hint">Когда появятся счета в других валютах, здесь можно будет указать курсы.</p>') +
      '<div class="actions"><div class="r"><button type="submit" class="btn primary sm">Сохранить</button></div></div>' +
    '</form>' +
    '<hr class="sep">' +
    '<form class="form" id="fConnect" autocomplete="off">' +
      '<h3>Синхронизация через Google Диск</h3>' +
      '<div class="status-line" id="syncLine" data-s="' + syncState + '"><i></i><span>' + esc(syncLineText()) + '</span></div>' +
      '<label>Адрес веб-приложения или ссылка подключения<input class="inp" id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(cfg.url) + '" spellcheck="false" autocapitalize="off" autocorrect="off"></label>' +
      '<label>Ключ доступа<input class="inp num" id="cKey" placeholder="Не нужен, если вставлена ссылка подключения" value="' + esc(cfg.key) + '" spellcheck="false" autocapitalize="off" autocorrect="off"></label>' +
      '<div class="actions start">' +
        '<button type="submit" class="btn primary sm">' + (configured() ? 'Переподключить' : 'Подключить') + '</button>' +
        (configured() ? '<button type="button" class="btn sm" data-action="sync-now">Синхронизировать сейчас</button><button type="button" class="btn sm danger" data-action="disconnect">Отключить</button>' : '') +
      '</div>' +
    '</form>' +
    (configured()
      ? '<hr class="sep"><div class="form"><h3>Подключить второе устройство</h3>' +
        '<p class="hint">Android и компьютер: отсканируйте код или откройте ссылку, адрес и ключ подставятся сами. iPhone: перешлите себе ссылку, скопируйте её и вставьте в поле адреса в приложении, открытом с иконки.</p>' +
        '<div class="qr" id="qrBox"><span class="hint" style="color:#555">Загрузка кода…</span></div>' +
        '<div class="actions start"><button type="button" class="btn sm" data-action="copy-link">Скопировать ссылку</button></div></div>'
      : '') +
    '<hr class="sep">' +
    '<div class="form"><h3>Установка</h3>' +
      '<p class="hint">' + (isIos
        ? 'iPhone: откройте в Safari, нажмите «Поделиться», затем «На экран „Домой“». Подключайте Google Диск уже в приложении, открытом с иконки: у него своё хранилище, отдельное от Safari.'
        : 'Телефон: меню браузера ⋮, затем «Установить приложение». Компьютер: значок установки в адресной строке Chrome или Edge.') + '</p></div>' +
    '<hr class="sep">' +
    '<div class="form"><h3>Резервная копия</h3>' +
      '<p class="hint">Файл с данными лежит в папке «Органайзер» на Google Диске. Отдельную копию можно сохранить текстом.</p>' +
      '<div class="actions start"><button type="button" class="btn sm" data-action="copy-backup">Скопировать копию</button></div>' +
      '<textarea class="inp num" id="bkOut" rows="3" readonly hidden style="font-size:12px"></textarea>' +
      '<label>Восстановить из копии<textarea class="inp num" id="bkIn" rows="3" placeholder="Вставьте сюда скопированный текст" style="font-size:12px"></textarea></label>' +
      '<div class="actions"><button type="button" class="btn sm" data-action="restore">Восстановить</button><div class="r"><button type="button" class="btn" data-action="close-sheet">Закрыть</button></div></div>' +
    '</div>');
  if (configured()) {
    const box = $('#qrBox');
    loadQrLib().then(qrcode => {
      if (!box.isConnected) return;
      const q = qrcode(0, 'M');
      q.addData(setupLink());
      q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    }).catch(() => { if (box.isConnected) box.innerHTML = '<span class="hint" style="color:#555">Не удалось построить код. Используйте ссылку.</span>'; });
  }
}

/* ================= Тост ================= */
let toastTimer = null;
function toast(msg, opt) {
  opt = opt || {};
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (opt.action ? '<button type="button" class="link" id="toastAct">' + esc(opt.action) + '</button>' : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (opt.action) $('#toastAct').onclick = () => { t.classList.remove('show'); opt.onAction(); };
  toastTimer = setTimeout(() => t.classList.remove('show'), opt.action ? 6000 : 3200);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); } return false; }
}

/* ================= События ================= */
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  if (e.target === $('#sheet')) { closeSheet(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;

  switch (a) {
    case 'mode': ui.mode = el.dataset.mode; saveUi(); render(); break;
    case 'toggle-done': toggle(id, 'done'); break;
    case 'toggle-focus': toggle(id, 'focus'); break;
    case 'toggle-done-list': { const g = el.dataset.group; ui.showDone[g] = !ui.showDone[g]; render(); break; }
    case 'edit-item': itemSheet(id); break;
    case 'delete-item': closeSheet(); withUndo([id], 'Цель удалена', () => delRec(id)); break;

    case 'new-group': groupSheet(null); break;
    case 'edit-group': groupSheet(id); break;
    case 'group-up': case 'group-down': moveRec(id, a === 'group-up' ? -1 : 1, groups()); break;
    case 'delete-group': {
      closeSheet();
      const ids = [id].concat(live('item').filter(i => i.group === id).map(i => i.id));
      withUndo(ids, 'Группа удалена', () => putMany(ids.map(x => [x, null])));
      break;
    }
    case 'open-import': importSheet(); break;

    case 'new-account': accountSheet(null); break;
    case 'edit-account': accountSheet(id); break;
    case 'acc-up': case 'acc-down': moveRec(id, a === 'acc-up' ? -1 : 1, accounts()); break;
    case 'delete-account': closeSheet(); withUndo([id], 'Счёт удалён', () => delRec(id)); break;

    case 'close-sheet': closeSheet(); break;
    case 'open-settings': settingsSheet(); break;
    case 'sync-now': sync(); break;
    case 'disconnect':
      cfg = { url: '', key: '' };
      saveCfg();
      setSync('off');
      closeSheet();
      toast('Синхронизация отключена, данные остались на устройстве');
      break;
    case 'copy-link':
      copyText(setupLink()).then(ok => toast(ok ? 'Ссылка скопирована. Не пересылайте её посторонним: в ней ключ доступа' : 'Скопировать не удалось'));
      break;
    case 'copy-backup': {
      const out = {};
      Object.keys(state.records).forEach(k => { if (!state.records[k].del) out[k] = state.records[k]; });
      const text = JSON.stringify({ app: 'life-organizer', v: 3, exported: new Date().toISOString(), records: out });
      copyText(text, $('#bkOut')).then(ok => toast(ok ? 'Копия скопирована в буфер обмена' : 'Выделите текст в поле и скопируйте вручную'));
      break;
    }
    case 'restore': {
      const inp = $('#bkIn'); if (!inp) break;
      let parsed;
      try { parsed = JSON.parse(inp.value); } catch (err) { inp.classList.add('err'); toast('Текст не похож на резервную копию'); break; }
      const src = parsed && parsed.records && typeof parsed.records === 'object' ? parsed.records : null;
      if (!src) { inp.classList.add('err'); toast('В копии нет данных'); break; }
      const entries = Object.keys(src)
        .filter(k => src[k] && typeof src[k] === 'object' && KINDS.includes(src[k].kind) && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(k))
        .map(k => [k, src[k]]);
      if (!entries.length) { toast('В копии нет подходящих записей'); break; }
      closeSheet();
      putMany(entries);
      toast('Восстановлено записей: ' + entries.length);
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet').classList.contains('open')) { closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();

  if (f.classList.contains('add-item')) {
    const inp = f.querySelector('input'); const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    addItem(f.dataset.group, text);
    return;
  }

  if (f.id === 'fItem') {
    const title = $('#fTitle').value.trim(); if (!title) return;
    const ex = getRec(f.dataset.id); if (!ex) { closeSheet(); return; }
    const g = $('#fGroup');
    closeSheet();
    setRec(Object.assign({}, ex, { title, details: $('#fDetails').value.trim(), group: g ? g.value : ex.group, focus: $('#fFocus').checked && !ex.done }));
    return;
  }

  if (f.id === 'fGroupForm') {
    const name = $('#fName').value.trim(); if (!name) return;
    const id = f.dataset.id;
    closeSheet();
    const ex = id && getRec(id);
    if (ex) setRec(Object.assign({}, ex, { name }));
    else {
      const gid = addGroup(name);
      if (ui.mode !== 'all') { ui.mode = 'all'; saveUi(); render(); }
      setTimeout(() => { const inp = document.getElementById('add-' + gid); if (inp) inp.focus(); }, 50);
    }
    return;
  }

  if (f.id === 'fImport') {
    const parsed = parseOutline($('#fText').value);
    const itemsTotal = parsed.reduce((n, g) => n + g.items.length, 0);
    if (!parsed.length) { $('#fText').classList.add('err'); return; }
    const existing = groups();
    let order = nextOrder('group');
    const entries = [];
    let newGroups = 0;
    parsed.forEach(pg => {
      let g = existing.find(x => x.name.trim().toLowerCase() === pg.name.trim().toLowerCase());
      let gid;
      if (g) gid = g.id;
      else {
        gid = newId('g');
        entries.push([gid, { kind: 'group', name: pg.name, order: order++, createdAt: Date.now() }]);
        newGroups++;
      }
      pg.items.forEach((line, k) => {
        const p = splitTitle(line);
        if (!p.title) return;
        entries.push([newId('i') + k, { kind: 'item', group: gid, title: p.title, details: p.details, focus: false, done: false, doneAt: null, createdAt: Date.now() + k }]);
      });
    });
    closeSheet();
    if (ui.mode !== 'all') { ui.mode = 'all'; saveUi(); }
    const ids = entries.map(x => x[0]);
    withUndo(ids, 'Добавлено: групп ' + newGroups + ', целей ' + itemsTotal, () => putMany(entries));
    return;
  }

  if (f.id === 'fAccount') {
    const name = $('#fName').value.trim(); if (!name) return;
    const amount = evalAmount($('#fAmount').value);
    if (amount === null) { $('#fAmount').classList.add('err'); $('#fAmount').focus(); toast('Не получилось прочитать сумму'); return; }
    const id = f.dataset.id;
    const ex = id && getRec(id);
    const body = { name, amount, cur: $('#fCur').value, note: $('#fNote').value.trim() };
    closeSheet();
    if (ex) setRec(Object.assign({}, ex, body, { at: ex.amount !== amount || ex.cur !== body.cur ? Date.now() : (ex.at || Date.now()) }));
    else setRec(Object.assign({ id: newId('a'), kind: 'account', order: nextOrder('account'), createdAt: Date.now(), at: Date.now() }, body));
    return;
  }

  if (f.id === 'fMoney') {
    const rates = Object.assign({}, settings().rates || {});
    let bad = false;
    f.querySelectorAll('[data-cur]').forEach(inp => {
      const raw = inp.value.trim();
      if (!raw) { delete rates[inp.dataset.cur]; return; }
      const v = evalAmount(raw);
      if (!v || v <= 0) { inp.classList.add('err'); bad = true; return; }
      rates[inp.dataset.cur] = v;
    });
    if (bad) return;
    const base = $('#fBase').value;
    const prevBase = settings().base || 'RUB';
    setRec(Object.assign({ id: 'settings', kind: 'settings' }, settings(), { base, rates: base !== prevBase ? {} : rates }));
    if (base !== prevBase) { settingsSheet(); toast('Валюта итога изменена, укажите курсы заново'); }
    else { closeSheet(); toast('Сохранено'); }
    return;
  }

  if (f.id === 'fConnect') {
    const btn = f.querySelector('[type="submit"]');
    btn.disabled = true;
    connect($('#cUrl').value, $('#cKey').value).then(ok => {
      btn.disabled = false;
      if (ok && $('#sheet').dataset.kind === 'settings') settingsSheet();
    });
  }
});

document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('err')) e.target.classList.remove('err'); });

window.addEventListener('storage', e => {
  if (e.key === LS_DATA) { state = loadState(); render(); }
  if (e.key === LS_CFG) { cfg = loadCfg(); setSync(configured() ? 'ok' : 'off'); }
});
window.addEventListener('online', () => sync());
window.addEventListener('offline', () => { if (configured()) setSync('offline'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { render(); sync(); } });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);

/* ================= Запуск ================= */
async function init() {
  let setupFromLink = null;
  const h = location.hash.slice(1);
  if (h.indexOf('setup=') === 0) {
    try { const c = JSON.parse(b64urlDecode(h.slice(6))); if (c && c.url && c.key) setupFromLink = c; } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  render();
  setSync(configured() ? 'ok' : 'off');

  if (setupFromLink) await connect(setupFromLink.url, setupFromLink.key);
  else sync();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

init();
})();
</script>
